# Local development source deployment using the existing HITL image.
# Build hitl-api after dependency changes, then start with --no-build.
# The shared image contains ReportLab; do not install packages into live containers.
services:
  kafka:
    volumes:
      - specula-kafka-data:/var/lib/kafka/data
  redis:
    volumes:
      - specula-redis-data:/data
  quickwit:
    volumes:
      - specula-quickwit-data:/quickwit/qwdata
  neo4j:
    volumes:
      - specula-neo4j-data:/data
  hitl-api:
    env_file:
      - ./data/private/backend.env
    volumes:
      - ./src:/app/src:ro
      - ./data:/app/data:ro
      - ./data/analytics:/app/data/analytics
      - specula-checkpoints:/app/checkpoints
      - ./data/private:/app/private:ro
    environment:
      SPECULA_AUTH_POLICY_PATH: /app/private/auth_policy.json
      SPECULA_CHECKPOINT_BACKEND: sqlite
      SPECULA_CHECKPOINT_PATH: /app/checkpoints/specula.sqlite3
      SPECULA_LLM_BACKEND: ollama
      SPECULA_THREAT_ATTRIBUTION_BACKEND: ollama
      SPECULA_OLLAMA_BASE_URL: http://host.docker.internal:11434
      SPECULA_OLLAMA_MODEL: qwen3:8b
  visualizer-api:
    env_file:
      - ./data/private/backend.env
    image: specula-skeleton-hitl-api
    command: ["python", "-m", "uvicorn", "src.agents.visualizer_api:app", "--host", "0.0.0.0", "--port", "8300"]
    ports:
      - "127.0.0.1:8300:8300"
    volumes:
      - ./src:/app/src:ro
      - ./data:/app/data:ro
      - ./data/analytics:/app/data/analytics
      - specula-checkpoints:/app/checkpoints
      - ./data/private:/app/private:ro
    environment:
      SPECULA_AUTH_POLICY_PATH: /app/private/auth_policy.json
      SPECULA_CHECKPOINT_BACKEND: sqlite
      SPECULA_CHECKPOINT_PATH: /app/checkpoints/specula.sqlite3
      SPECULA_LLM_BACKEND: ollama
      SPECULA_THREAT_ATTRIBUTION_BACKEND: ollama
      SPECULA_OLLAMA_BASE_URL: http://host.docker.internal:11434
      SPECULA_OLLAMA_MODEL: qwen3:8b
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      NEO4J_URI: bolt://neo4j:7687
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      QUICKWIT_ENDPOINT: http://quickwit:7280
    depends_on:
      - kafka
      - neo4j
      - redis
      - quickwit
      - chromadb
  dfkg-consumer:
    image: specula-skeleton-hitl-api
    command: ["python", "-c", "from src.agents.kafka_utils import run_dfkg_consumer; run_dfkg_consumer()"]
    volumes:
      - ./src:/app/src:ro
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      NEO4J_URI: bolt://neo4j:7687
    depends_on:
      - kafka
      - neo4j
    restart: on-failure
  normalized-consumer:
    image: specula-skeleton-hitl-api
    command: ["python", "-m", "src.ingestion.broker.ingestion_consumer"]
    volumes:
      - ./src:/app/src:ro
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      NEO4J_URI: bolt://neo4j:7687
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      SPECULA_OLLAMA_BASE_URL: http://host.docker.internal:11434
      SPECULA_EMBEDDING_MODEL: qwen3-embedding:0.6b
    depends_on:
      - kafka
      - neo4j
      - chromadb
    restart: on-failure

volumes:
  specula-checkpoints:
  specula-kafka-data:
  specula-redis-data:
  specula-quickwit-data:
  specula-neo4j-data:
