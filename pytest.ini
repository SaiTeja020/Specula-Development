[pytest]
markers =
    live_infra: requires the real docker-compose stack (Quickwit, Kafka, Neo4j, Redis, ChromaDB, Rebuff, Schema Registry) instead of fakes
    performance: throughput/latency benchmark, not a pass/fail correctness test by itself
    regression: encodes a specific defect found during architecture review — do not delete without reading why it exists
    slow: takes more than a few seconds; excluded from the fast pre-commit loop
    integration: requires real Kafka/Neo4j/Redis infra — run with pytest -m integration
    production_readiness: production gates and real backup/performance checks; development defaults may fail

addopts = -v --strict-markers -m "not integration and not live_infra and not production_readiness"

testpaths = tests
python_files = *.py test_*.py
pythonpath = .
asyncio_mode = auto
